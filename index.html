<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Computador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Painel do Computador</h1>

    <section>
        <h2>Navegador e Sistema</h2>
        <table id="sistema"></table>
    </section>

    <section>
        <h2>Tela e Janela</h2>
        <table id="tela"></table>
    </section>

    <section>
        <h2>Localização</h2>
        <button id="btn-local">Mostrar minha Localização</button>
        <p id="local"></p>
    </section>

    <section>
        <h2>Arquivos</h2>
        <input type="file" id="Arquivos" multiple>
        <table id="lista-arquivos"></table>
    </section>

    <script src="script.js"></script>
</body>
</html>
